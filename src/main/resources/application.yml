server:
  port: 8080

spring:
  config:
    # Tự động đọc biến môi trường từ file .env ở thư mục gốc (nếu có)
    import: optional:file:.env[.properties]

  # Cấu hình Driver kết nối MongoDB cấp hệ thống
  mongodb:
    uri: ${MONGODB_URI}

  # Cấu hình hành vi tầng Spring Data Repositories
  data:
    mongodb:
      auto-index-creation: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 giờ